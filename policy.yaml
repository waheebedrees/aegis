version: 1

agents:
  spiffe://agentic.local/agent/planner:
    type: planner
    tools:  ["tool.sql.read", "tool.github.*"]
    models: ["gpt-4o-mini"]
    max_tokens_per_task: 50000
    # NEW: autonomous capabilities
    delegate_to: ["executor", "reviewer"]
    max_concurrent_tasks: 5
    max_subtask_depth: 3
    can_create_plans: true
    can_observe: ["tool.*"]
    memory_ttl: 86400


  spiffe://agentic.local/agent/executor:
    type: executor
    tools:  ["tool.*"]
    models: ["gpt-4o-mini", "claude-sonnet-4-*"]
    max_tokens_per_task: 200000
    delegate_to: []              # leaf agent, can't delegate
    max_concurrent_tasks: 10
    max_subtask_depth: 0
    can_create_plans: false

  spiffe://agentic.local/agent/reviewer:
    type: reviewer
    tools:  ["tool.github.read_*", "tool.sql.read"]
    models: ["gpt-4o-mini"]
    max_tokens_per_task: 30000
    delegate_to: []
    max_concurrent_tasks: 3
    max_subtask_depth: 0
    can_create_plans: false

  spiffe://agentic.local/:
    tools:  ["tool.*"]
    models: ["gpt-4o-mini", "claude-sonnet-4-*"]
    max_tokens_per_task: 200000