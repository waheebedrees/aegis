


agent {
    log_level           = "INFO"
    server_address      = "spire-server"
    server_port         = "8081"
    socket_path         = "/run/spire/sockets/agent.sock"
    data_dir            = "/opt/spire/data/agent"
    trust_domain        = "spire.lab.acme"
    trust_bundle_path   = "/opt/spire/data/agent/bootstrap.crt"
}


plugins {
    
    KeyManager "disk" {
        plugin_data {

            directory = "/opt/spire/data/agent"
        }
   }
    NodeAttestor "x509pop" {
        plugin_data {
            private_key_path = "/etc/spire/conf/agent/agent.key"
            certificate_path = "/etc/spire/conf/agent/agent.crt"
        }
    }
  
    WorkloadAttestor "unix"   {
     plugin_data { discover_workload_path = true } 
    
    }

}
