[project]
name = "aegis-libs"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "spiffe>=0.3.2",
  "cryptography>=42",
  "pyjwt[crypto]>=2.8",
  "httpx[http2]>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "structlog>=24.1",
  "redis>=5.0",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs"]