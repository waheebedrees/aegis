[project]
name = "aegis"

version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46.0.7",
    "dotenv>=0.9.9",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "redis>=8.1.0",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[tool.uv.workspace]

members = [
  "libs",
  "aegis/services/orchestrator", 
  "aegis/services/worker",
  "aegis/services/tools", 
  "aegis/services/llm-gateway",
  "cli/*"
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "watchfiles>=0.21",
  "mypy>=1.11",
]



[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.mypy]
python_version = "3.11"
strict = true

[project.scripts]
# aegis = "gov:main"
aegis = "cli.agentctl.agentctl.main:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["gov.py", "libs", "config", "agentctl"]
exclude = [
  "config/*.toml",
  "config/*.bundle",
  "config/node-*.toml",
  "**/__pycache__",
]