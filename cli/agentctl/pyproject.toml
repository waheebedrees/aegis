[project]
name = "agentctl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "agentid",
  "typer>=0.12",
  "httpx>=0.27",
]

[project.scripts]
agentctl = "agentctl.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentctl"]

[tool.uv.sources]
aegis-libs = { workspace = true }