name: dev 

x-spiffe: &spiffe
  env_file:
    - .env.container
  environment:
    LISTEN_HOST: 0.0.0.0
    LISTEN_PORT: '8443'
    SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
    POLICY_PATH: /app/policy.yaml
    TRUST_DOMAIN: ${TRUST_DOMAIN:-spire.lab.acme}
    ATTEST_INTERVAL_SECONDS: "${ATTEST_INTERVAL_SECONDS:-60}"
    LOG_LEVEL: info
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes:
    - spire-sockets:/run/spire/sockets:ro
    - ./policy.yaml:/app/policy.yaml:ro
    - ./libs:/app/libs:ro        
  networks: [node-net, data-net]
  depends_on:
    spire-agent: { condition: service_healthy }
    redis:       { condition: service_healthy }
    postgres:    { condition: service_healthy }
    
  restart: on-failure


services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.14.4
    container_name: spire-server
    hostname: spire-server
    command: ["-config", "/opt/spire/server/server.conf"]
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./deploy/dev/spire/server.conf:/opt/spire/server/server.conf:ro
      - ./deploy/dev/spire/x509pop/ca.crt:/opt/spire/conf/server/x509pop-ca.crt:ro
      - spire-server-data:/opt/spire/data/server
    depends_on:
      volumes-init:
        condition: service_completed_successfully

    networks:
      - spire-net
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.14.4
    container_name: spire-agent    
    cap_add:
    - SYS_PTRACE
    # DEV ONLY: pid:host lets the agent resolve caller PIDs to containers.
    pid: host
    hostname: spire-agent
    command: ["-config", "/opt/spire/agent/agent.conf"]
    volumes:
      - ./deploy/dev/spire/agent.conf:/opt/spire/agent/agent.conf:ro
      - ./deploy/dev/spire/x509pop/x509pop-agent.key:/etc/spire/conf/agent/agent.key:ro
      - ./deploy/dev/spire/x509pop/x509pop-agent.crt:/etc/spire/conf/agent/agent.crt:ro
      - ./deploy/dev/spire/x509pop/bootstrap.crt:/opt/spire/data/agent/bootstrap.crt:ro
      - spire-sockets:/run/spire/sockets
      - spire-agent-data:/opt/spire/data/agent
    depends_on:
      spire-server:
        condition: service_healthy
      volumes-init:
        condition: service_completed_successfully
    networks:
      - spire-net
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/run/spire/sockets/agent.sock"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  volumes-init:
    image: alpine:3.10
    container_name: volumes-init
    hostname: volumes-init
    command: 
      - sh
      - -c 
      - chown -R 1000:1000 /opt/spire/data/server /opt/spire/data/agent
    volumes:
      - spire-server-data:/opt/spire/data/server
      - spire-agent-data:/opt/spire/data/agent
    networks: [spire-net]
  
  orchestrator:
    <<: *spiffe
    image: agent-orchestrator:dev
    container_name: orchestrator
    build:
      context: .
      dockerfile: Dockerfile
      target: dev              
      args:
        UID: '10001'
        GID: '10001'
        SERVICE: orchestrator
    hostname: orchestrator
    labels:
      role: orchestrator


    develop:
      watch:
        - action: sync
          path: ./aegis/services/orchestrator
          target: /app
          ignore: [__pycache__, "*.pyc"]
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
  worker:
    <<: *spiffe
    image: agent-worker:dev                   
    build:
      context: .
      target: dev                 

      dockerfile: Dockerfile
      args:
        UID: '10002'
        GID: '10002'
        SERVICE: worker
    container_name: worker
    hostname: worker
    labels:
      role: worker
    develop:
      watch:
    
        - action: sync
          path: ./aegis/services/worker
          target: /app
          ignore: [__pycache__, "*.pyc"]
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
  redis:
    image: redis:latest           
    ports:
      - "6379:6379"
    container_name: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    volumes:
      - ./data/redis_data:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 3s
    restart: unless-stopped
    networks: [data-net]

  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432 
    volumes:
      - ./data/pg_data:/var/lib/postgresql 
    restart: unless-stopped
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capchain"]
      interval: 5s
      timeout: 2s
      retries: 10
    networks: [data-net]
    
networks:
  spire-net:
    internal: true
    name: spire-net
  node-net:
    internal: true
    name: node-net
  idp-net:
    internal: true
    name: idp-net
  data-net:
    internal: true
    name: data-net

volumes:
  spire-server-data:
    name: spire-server-data
  spire-agent-data:
    name: spire-agent-data
  spire-sockets:
    name: spire-sockets
